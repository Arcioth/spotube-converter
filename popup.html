<!DOCTYPE html>
<html>
<head>
  <style>
    body { padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #ffffff; }
    h3 { margin-top: 0; margin-bottom: 15px; font-weight: 500; font-size: 24px; color: #ffffff; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaaaaa; }
    input[type="text"], input[type="file"] { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 15px; background: #212121; border: 1px solid #333333; color: white; border-radius: 4px; font-size: 14px; }
    button { width: 100%; padding: 12px; background-color: #ffffff; color: #000000; border: none; border-radius: 20px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background-color 0.2s; }
    button:hover { background-color: #dddddd; }
    button:disabled { background-color: #555555; color: #888888; cursor: not-allowed; }
    #clearLogsBtn { margin-top: 10px; background-color: #333333; color: white; }
    #clearLogsBtn:hover { background-color: #444444; }
    #log { margin-top: 15px; font-size: 13px; height: 400px; overflow-y: auto; background: #000000; border: 1px solid #333333; padding: 12px; white-space: pre-wrap; border-radius: 4px; font-family: monospace; color: #00ff00; }
    .error { color: #ff5555; }
    .info { color: #aaaaaa; }
    .container { max-width: 600px; margin: 0 auto; padding-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h3>Spotube Migrator</h3>
    
    <label>New Playlist Name:</label>
    <input type="text" id="playlistTitle" placeholder="Migrated Spotify Playlist" />
    
    <label>Spotify Export (CSV):</label>
    <input type="file" id="csvFile" accept=".csv" />
    
    <button id="migrateBtn">Migrate to YouTube Music</button>
    <button id="clearLogsBtn">Clear Logs</button>
    
    <div id="log"><span class="info">Ready. Please ensure you have music.youtube.com open in another tab before starting.</span>\n</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>

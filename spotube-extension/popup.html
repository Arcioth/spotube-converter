<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 400px; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #ffffff; }
    h3 { margin-top: 0; margin-bottom: 15px; font-weight: 500; font-size: 18px; color: #ffffff; }
    label { display: block; margin-bottom: 5px; font-size: 12px; color: #aaaaaa; }
    input[type="text"], textarea { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 15px; background: #212121; border: 1px solid #333333; color: white; border-radius: 4px; font-family: monospace; }
    textarea { height: 100px; resize: vertical; }
    button { width: 100%; padding: 10px; background-color: #ffffff; color: #000000; border: none; border-radius: 20px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
    button:hover { background-color: #dddddd; }
    button:disabled { background-color: #555555; color: #888888; cursor: not-allowed; }
    #log { margin-top: 15px; font-size: 11px; height: 150px; overflow-y: auto; background: #000000; border: 1px solid #333333; padding: 8px; white-space: pre-wrap; border-radius: 4px; font-family: monospace; color: #00ff00; }
    .error { color: #ff5555; }
    .info { color: #aaaaaa; }
  </style>
</head>
<body>
  <h3>Spotube Migrator</h3>
  
  <label>New Playlist Name:</label>
  <input type="text" id="playlistTitle" placeholder="Migrated Spotify Playlist" />
  
  <label>Spotify Export (Open the CSV in a text editor and paste it here):</label>
  <textarea id="csvData" placeholder="track,artist,album...\nSong Name,Artist Name,..."></textarea>
  
  <button id="migrateBtn">Migrate to YouTube Music</button>
  
  <div id="log"><span class="info">Ready. Please ensure you are logged into music.youtube.com before starting.</span>\n</div>
  
  <script src="popup.js"></script>
</body>
</html>
